map $http_x_forwarded_proto $sq_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Keep the OIDC authorization code on the server side. The SPA must never
  # receive or render this callback route.
  location = /auth/callback {
    access_log off;
    proxy_pass http://api:3100/auth/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $sq_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # KIRIM-IMPL-001 §10: the Kirim SQ consumer API is loopback-only on the API host and is
  # never reachable through the browser entry point.
  location ^~ /api/internal/kirim/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $sq_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
