name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sq_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sq_hub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sq_hub_test
      HCIS_CANONICAL_URL: https://hcis-staging.sabilulquran.or.id
      KEYCLOAK_ISSUER: https://login.sabilulquran.or.id/realms/sq-staff-staging
      MACHINE_TOKEN_AUDIENCE: sq-hub-api-staging
      ALLOWED_MACHINE_CLIENTS: hcis-api-staging

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate diff whitespace
        run: git diff --check HEAD^1..HEAD

      - name: Scoped secret scan
        shell: bash
        run: |
          if git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|client[_ -]?secret[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{24,}|password[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{24,})' -- \
            apps/web \
            apps/api \
            docs/specs/HUB-IMPL-017-sq-hub-akun-sq-navigation-experience.md \
            docs/specs/HUB-IMPL-019-native-akun-sq-experience.md \
            infra/keycloak/themes/sq-hub \
            tools/visual; then
            echo "Potential secret material detected in HUB-IMPL-017 scope" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Apply migrations from empty database
        run: npm run migrate

      - name: Verify migrations are idempotent
        run: npm run migrate

      - name: Seed staging-shaped registry data
        run: npm run seed

      - name: Typecheck API and web
        run: npm run typecheck

      - name: Lint API and web
        run: npm run lint

      - name: Test API and web
        run: npm run test

      - name: Build API and web
        run: npm run build

      - name: Validate staging Compose
        run: docker compose --env-file infra/staging.env.example -f infra/docker-compose.staging.yml config -q

      - name: Build staging API image
        run: docker build -f apps/api/Dockerfile -t sq-hub-api:ci .

      - name: Build SQ Hub web image
        run: docker build -f apps/web/Dockerfile -t sq-hub-web:ci .

      - name: Build design-preview bundle
        if: github.event_name == 'pull_request'
        run: VITE_SQ_HUB_PREVIEW=1 npm run build:web

      - name: Capture desktop and mobile visual smoke
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npm --workspace @sq-hub/web run preview -- --host 127.0.0.1 --port 4173 >/tmp/sq-hub-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/sq-hub-preview.log
              exit 1
            fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner"
            exit 1
          fi

          mkdir -p visual-smoke

          check_no_overflow() {
            width="$1"
            height="$2"
            url="$3"
            output="/tmp/sq-hub-overflow-$width-$height.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=800 --window-size="$width,$height" --dump-dom "$url" > "$output"
            grep -Fq 'data-preview-horizontal-overflow="false"' "$output"
          }

          check_no_overflow 320 844 http://127.0.0.1:4173/
          check_no_overflow 360 844 http://127.0.0.1:4173/
          check_no_overflow 390 844 http://127.0.0.1:4173/
          check_no_overflow 412 844 http://127.0.0.1:4173/
          check_no_overflow 768 900 http://127.0.0.1:4173/
          check_no_overflow 1280 720 http://127.0.0.1:4173/
          check_no_overflow 1440 900 http://127.0.0.1:4173/
          check_no_overflow 390 844 http://127.0.0.1:4173/apps
          check_no_overflow 390 844 http://127.0.0.1:4173/account
          check_no_overflow 1280 720 http://127.0.0.1:4173/account
          for section in security sessions applications linked groups; do
            check_no_overflow 390 844 "http://127.0.0.1:4173/account?section=$section"
            check_no_overflow 1280 720 "http://127.0.0.1:4173/account?section=$section"
          done

          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1000 --window-size=1440,900 --dump-dom 'http://127.0.0.1:4173/?preview=launcher&exercise=escape' > /tmp/launcher-escape.html
          grep -Fq 'data-preview-escape-restored="true"' /tmp/launcher-escape.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=1000 --window-size=1440,900 --dump-dom 'http://127.0.0.1:4173/?preview=account-menu&exercise=escape' > /tmp/account-menu-escape.html
          grep -Fq 'data-preview-escape-restored="true"' /tmp/account-menu-escape.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-hub-home-desktop-1440x900.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-hub-apps-desktop-1440x900.png http://127.0.0.1:4173/apps
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-hub-launcher-desktop.png 'http://127.0.0.1:4173/?preview=launcher'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-hub-account-menu-desktop.png 'http://127.0.0.1:4173/?preview=account-menu'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-hub-empty-workspace.png 'http://127.0.0.1:4173/?state=empty'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/sq-hub-home-mobile-390x844.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/sq-hub-launcher-mobile-390x844.png 'http://127.0.0.1:4173/?preview=launcher'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/sq-hub-bottom-nav-mobile.png 'http://127.0.0.1:4173/?state=ordinary'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-admin-authorized-desktop.png http://127.0.0.1:4173/admin
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-hub-ordinary-no-admin.png 'http://127.0.0.1:4173/?state=ordinary'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/akun-sq-native-account-desktop.png http://127.0.0.1:4173/account
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/akun-sq-native-account-mobile-390x844.png http://127.0.0.1:4173/account
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/akun-sq-security-mobile-390x844.png 'http://127.0.0.1:4173/account?section=security'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/akun-sq-sessions-mobile-390x844.png 'http://127.0.0.1:4173/account?section=sessions'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/akun-sq-applications-mobile-390x844.png 'http://127.0.0.1:4173/account?section=applications'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/akun-sq-linked-mobile-390x844.png 'http://127.0.0.1:4173/account?section=linked'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/akun-sq-groups-mobile-390x844.png 'http://127.0.0.1:4173/account?section=groups'

          test "$(find visual-smoke -name '*.png' | wc -l)" -eq 17

      - name: Upload visual smoke screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sq-hub-visual-smoke
          path: visual-smoke/*.png
          if-no-files-found: error
          retention-days: 7
