name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sq_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sq_hub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sq_hub_test
      HCIS_CANONICAL_URL: https://hcis-staging.sabilulquran.or.id
      KEYCLOAK_ISSUER: https://login-staging.sabilulquran.or.id/realms/sq-staff-staging
      MACHINE_TOKEN_AUDIENCE: sq-hub-api-staging
      ALLOWED_MACHINE_CLIENTS: hcis-api-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply migrations
        run: npm run migrate

      - name: Seed staging-shaped registry data
        run: npm run seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
