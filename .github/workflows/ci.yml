name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sq_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sq_hub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sq_hub_test
      HCIS_CANONICAL_URL: https://hcis-staging.sabilulquran.or.id
      KEYCLOAK_ISSUER: https://login.sabilulquran.or.id/realms/sq-staff-staging
      MACHINE_TOKEN_AUDIENCE: sq-hub-api-staging
      ALLOWED_MACHINE_CLIENTS: hcis-api-staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Apply migrations from empty database
        run: npm run migrate

      - name: Verify migrations are idempotent
        run: npm run migrate

      - name: Seed staging-shaped registry data
        run: npm run seed

      - name: Typecheck API and web
        run: npm run typecheck

      - name: Lint API and web
        run: npm run lint

      - name: Test API and web
        run: npm run test

      - name: Build API and web
        run: npm run build

      - name: Validate staging Compose
        run: docker compose --env-file infra/staging.env.example -f infra/docker-compose.staging.yml config -q

      - name: Build staging API image
        run: docker build -f apps/api/Dockerfile -t sq-hub-api:ci .

      - name: Build SQ Hub web image
        run: docker build -f apps/web/Dockerfile -t sq-hub-web:ci .

      - name: Build design-preview bundle
        if: github.event_name == 'pull_request'
        run: VITE_SQ_HUB_PREVIEW=1 npm run build:web

      - name: Capture desktop and mobile visual smoke
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npm --workspace @sq-hub/web run preview -- --host 127.0.0.1 --port 4173 >/tmp/sq-hub-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/sq-hub-preview.log
              exit 1
            fi
            sleep 1
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found on runner"
            exit 1
          fi

          mkdir -p visual-smoke
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-hub-desktop-1440x900.png http://127.0.0.1:4173
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/sq-hub-mobile-390x844.png http://127.0.0.1:4173
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-smoke/sq-admin-desktop-1440x900.png http://127.0.0.1:4173/admin
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/sq-admin-mobile-390x844.png http://127.0.0.1:4173/admin

          test -s visual-smoke/sq-hub-desktop-1440x900.png
          test -s visual-smoke/sq-hub-mobile-390x844.png
          test -s visual-smoke/sq-admin-desktop-1440x900.png
          test -s visual-smoke/sq-admin-mobile-390x844.png

      - name: Upload visual smoke screenshots
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sq-hub-visual-smoke
          path: visual-smoke/*.png
          if-no-files-found: error
          retention-days: 7
