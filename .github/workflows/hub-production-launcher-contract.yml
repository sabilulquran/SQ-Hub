name: Hub Production Launcher Contract

on:
  pull_request:
    paths:
      - ".github/workflows/hub-production-launcher-contract.yml"
      - ".github/workflows/deploy-production.yml"
      - "tools/production/**"
      - "infra/docker-compose.production.yml"
      - "infra/production.env.example"
      - "infra/reverse-proxy.caddy.production.example"
      - "infra/keycloak/clients/sq-hub-production.json"
      - "infra/keycloak/scripts/reconcile-hub-production-client.sh"
      - "infra/keycloak/scripts/verify-hub-production-secret-fingerprint.sh"
      - "infra/keycloak/scripts/reconcile-master-production-recovery.sh"
      - "infra/keycloak/realm/master-production-recovery.json"
      - "infra/keycloak/master-smtp.env.example"
      - "infra/keycloak/themes/sq-hub/login/footer.ftl"
      - "infra/keycloak/themes/sq-hub/account/theme.properties"
      - "docs/operations/project-status-2026-09-18.md"
      - "docs/specs/HUB-IMPL-016-hub-production-launcher.md"
      - "docs/operations/HUB-IMPL-016-production-launcher.md"
      - "apps/web/src/security.test.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hub-production-launcher-contract.yml"
      - ".github/workflows/deploy-production.yml"
      - "tools/production/**"
      - "infra/docker-compose.production.yml"
      - "infra/production.env.example"
      - "infra/reverse-proxy.caddy.production.example"
      - "infra/keycloak/clients/sq-hub-production.json"
      - "infra/keycloak/scripts/reconcile-hub-production-client.sh"
      - "infra/keycloak/scripts/verify-hub-production-secret-fingerprint.sh"
      - "infra/keycloak/scripts/reconcile-master-production-recovery.sh"
      - "infra/keycloak/realm/master-production-recovery.json"
      - "infra/keycloak/master-smtp.env.example"
      - "infra/keycloak/themes/sq-hub/login/footer.ftl"
      - "infra/keycloak/themes/sq-hub/account/theme.properties"
      - "docs/operations/project-status-2026-09-18.md"
      - "docs/specs/HUB-IMPL-016-hub-production-launcher.md"
      - "docs/operations/HUB-IMPL-016-production-launcher.md"
      - "apps/web/src/security.test.ts"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate production repository contract
        run: python3 tools/production/verify_hub_launcher_contract.py

      - name: Validate guarded production deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          deploy='.github/workflows/deploy-production.yml'
          test -f "$deploy"
          grep -Fq 'workflow_dispatch:' "$deploy"
          grep -Fq 'environment: production' "$deploy"
          grep -Fq 'group: sq-hub-production' "$deploy"
          grep -Fq 'DEPLOY_PRODUCTION' "$deploy"
          grep -Fq 'BACKUP_VERIFIED' "$deploy"
          grep -Fq 'SQ_HUB_PROD_SSH_PRIVATE_KEY' "$deploy"
          grep -Fq 'SQ_HUB_PROD_SSH_KNOWN_HOSTS' "$deploy"
          grep -Fq 'git rev-parse origin/main' "$deploy"
          grep -Fq 'apps/api package.json package-lock.json' "$deploy"
          grep -Fq 'apps/web package.json package-lock.json' "$deploy"
          grep -Fq 'infra/keycloak' "$deploy"
          grep -Fq 'SQ_HUB_API_IMAGE' "$deploy"
          grep -Fq 'SQ_HUB_WEB_IMAGE' "$deploy"
          grep -Fq 'SQ_HUB_KEYCLOAK_IMAGE' "$deploy"
          grep -Fq 'config -q' "$deploy"
          grep -Fq -- '--no-deps --no-build --pull never --force-recreate api' "$deploy"
          grep -Fq -- '--no-deps --no-build --pull never --force-recreate web' "$deploy"
          grep -Fq -- '--no-deps --no-build --pull never --force-recreate keycloak' "$deploy"
          grep -Fq 'PRODUCTION_ROLLBACK_BEGIN' "$deploy"
          grep -Fq 'SQ_HUB_PRODUCTION_DEPLOY_PASS' "$deploy"
          grep -Fq "docker logout ghcr.io" "$deploy"
          ! grep -Eq 'docker compose([^\n]*) up -d[[:space:]]*
      - name: Validate production reconciliation script syntax
        run: |
          bash -n infra/keycloak/scripts/reconcile-hub-production-client.sh
          bash -n infra/keycloak/scripts/verify-hub-production-secret-fingerprint.sh
          bash -n infra/keycloak/scripts/reconcile-master-production-recovery.sh

      - name: Secret scan for production launcher scope
        shell: bash
        run: |
          if git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|client[_ -]?secret[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{24,}|password[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{24,})' -- \
            infra/docker-compose.production.yml \
            infra/production.env.example \
            infra/reverse-proxy.caddy.production.example \
            infra/keycloak/clients/sq-hub-production.json \
            infra/keycloak/realm/master-production-recovery.json \
            infra/keycloak/master-smtp.env.example \
            infra/keycloak/scripts/reconcile-hub-production-client.sh \
            infra/keycloak/scripts/verify-hub-production-secret-fingerprint.sh \
            infra/keycloak/scripts/reconcile-master-production-recovery.sh \
            docs/specs/HUB-IMPL-016-hub-production-launcher.md \
            docs/operations/HUB-IMPL-016-production-launcher.md \
            docs/operations/project-status-2026-09-18.md; then
            echo "Potential secret material detected" >&2
            exit 1
          fi

      - name: Validate production Compose with non-secret render fixture
        shell: bash
        run: |
          sed             -e 's#postgresql://replace_with_db_user:replace_with_db_password@replace_with_existing_db_host:5432/replace_with_db_name#postgresql://user:pass@db:5432/sq_hub#'             -e 's#replace_with_existing_production_machine_audience#sq-hub-api-production#'             -e 's#replace_with_existing_production_machine_client_allowlist#hcis-api-production#'             -e 's#replace_with_secret_store_value_for_sq_hub_client#ci-placeholder-not-a-real-secret#'             -e 's#replace_with_existing_production_identity_directory_url#http://identity:8080#'             -e 's#replace_with_existing_production_directory_client_id#sq-hub-directory-production#'             -e 's#replace_with_secret_store_value_for_directory_client#ci-placeholder-not-a-real-secret#'             -e 's#replace_with_existing_sq_hub_production_network#sq_platform_production#'             -e 's#replace_with_reviewed_api_memory_limit#256m#'             -e 's#replace_with_reviewed_web_memory_limit#96m#'             infra/production.env.example > /tmp/hub-production.env

          docker compose --env-file /tmp/hub-production.env -f infra/docker-compose.production.yml config -q

      - name: Reject mutable production image references
        shell: bash
        run: |
          if grep -En 'SQ_HUB_(API|WEB)_IMAGE=.*:(latest|staging|main)([[:space:]]|$)' infra/production.env.example; then
            echo "Mutable production image reference found" >&2
            exit 1
          fi
          grep -Fq 'ghcr.io/sabilulquran/sq-hub-api@sha256:' infra/production.env.example
          grep -Fq 'ghcr.io/sabilulquran/sq-hub-web@sha256:' infra/production.env.example

      - name: Preserve browser token-storage prohibition
        run: npm ci --ignore-scripts && npm --workspace @sq-hub/web test -- --run src/security.test.ts
 "$deploy"

      - name: Validate production reconciliation script syntax
        run: |
          bash -n infra/keycloak/scripts/reconcile-hub-production-client.sh
          bash -n infra/keycloak/scripts/verify-hub-production-secret-fingerprint.sh
          bash -n infra/keycloak/scripts/reconcile-master-production-recovery.sh

      - name: Secret scan for production launcher scope
        shell: bash
        run: |
          if git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|client[_ -]?secret[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{24,}|password[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{24,})' -- \
            infra/docker-compose.production.yml \
            infra/production.env.example \
            infra/reverse-proxy.caddy.production.example \
            infra/keycloak/clients/sq-hub-production.json \
            infra/keycloak/realm/master-production-recovery.json \
            infra/keycloak/master-smtp.env.example \
            infra/keycloak/scripts/reconcile-hub-production-client.sh \
            infra/keycloak/scripts/verify-hub-production-secret-fingerprint.sh \
            infra/keycloak/scripts/reconcile-master-production-recovery.sh \
            docs/specs/HUB-IMPL-016-hub-production-launcher.md \
            docs/operations/HUB-IMPL-016-production-launcher.md \
            docs/operations/project-status-2026-09-18.md; then
            echo "Potential secret material detected" >&2
            exit 1
          fi

      - name: Validate production Compose with non-secret render fixture
        shell: bash
        run: |
          sed             -e 's#postgresql://replace_with_db_user:replace_with_db_password@replace_with_existing_db_host:5432/replace_with_db_name#postgresql://user:pass@db:5432/sq_hub#'             -e 's#replace_with_existing_production_machine_audience#sq-hub-api-production#'             -e 's#replace_with_existing_production_machine_client_allowlist#hcis-api-production#'             -e 's#replace_with_secret_store_value_for_sq_hub_client#ci-placeholder-not-a-real-secret#'             -e 's#replace_with_existing_production_identity_directory_url#http://identity:8080#'             -e 's#replace_with_existing_production_directory_client_id#sq-hub-directory-production#'             -e 's#replace_with_secret_store_value_for_directory_client#ci-placeholder-not-a-real-secret#'             -e 's#replace_with_existing_sq_hub_production_network#sq_platform_production#'             -e 's#replace_with_reviewed_api_memory_limit#256m#'             -e 's#replace_with_reviewed_web_memory_limit#96m#'             infra/production.env.example > /tmp/hub-production.env

          docker compose --env-file /tmp/hub-production.env -f infra/docker-compose.production.yml config -q

      - name: Reject mutable production image references
        shell: bash
        run: |
          if grep -En 'SQ_HUB_(API|WEB)_IMAGE=.*:(latest|staging|main)([[:space:]]|$)' infra/production.env.example; then
            echo "Mutable production image reference found" >&2
            exit 1
          fi
          grep -Fq 'ghcr.io/sabilulquran/sq-hub-api@sha256:' infra/production.env.example
          grep -Fq 'ghcr.io/sabilulquran/sq-hub-web@sha256:' infra/production.env.example

      - name: Preserve browser token-storage prohibition
        run: npm ci --ignore-scripts && npm --workspace @sq-hub/web test -- --run src/security.test.ts
