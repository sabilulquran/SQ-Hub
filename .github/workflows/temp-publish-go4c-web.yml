name: TEMP Publish Go4C Web Candidate

on:
  push:
    branches:
      - feat/hub-hcis-visual-parity
    paths:
      - ".github/workflows/temp-publish-go4c-web.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: 52b0c37b5e014160c25000b5d5d78c5846a30cf2

      - name: Set up Node for workspace lockfile
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate workspace lockfile for Docker build context
        run: npm install --package-lock-only --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/imadjinasi/sq-hub-web:sha-52b0c37b5e014160c25000b5d5d78c5846a30cf2
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
