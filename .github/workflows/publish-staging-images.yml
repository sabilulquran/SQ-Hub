name: Publish Staging Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "infra/keycloak/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-staging-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            image: ghcr.io/imadjinasi/sq-hub-api
            staging_tag: staging
          - name: keycloak
            dockerfile: infra/keycloak/Containerfile
            image: ghcr.io/imadjinasi/sq-hub-keycloak
            staging_tag: 26.7.2-staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for API lockfile
        if: matrix.name == 'api'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate API lockfile for Docker build context
        if: matrix.name == 'api'
        run: npm install --package-lock-only --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.staging_tag }}
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
