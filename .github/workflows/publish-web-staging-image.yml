name: Publish SQ Hub Web Staging Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit SHA or ref to build; use a commit SHA for pre-merge staging validation
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-web-staging-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sq-hub-web-staging-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_REPOSITORY: sabilulquran/SQ-Hub
      IMAGE_NAME: ghcr.io/sabilulquran/sq-hub-web
      OCI_SOURCE: https://github.com/sabilulquran/SQ-Hub

    steps:
      - name: Refuse non-organization publisher context
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Publisher context must be $EXPECTED_REPOSITORY; got $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          [[ "$IMAGE_NAME" == ghcr.io/sabilulquran/* ]]

      - name: Check out source to build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node for workspace lockfile
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate workspace lockfile for Docker build context
        run: npm install --package-lock-only --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable web image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and publish web staging image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify immutable organization image exists
        shell: bash
        run: |
          docker buildx imagetools inspect \
            "$IMAGE_NAME:sha-${{ steps.source.outputs.sha }}" >/dev/null
          echo "WEB_ORG_IMAGE_PUBLISH_PASS"
