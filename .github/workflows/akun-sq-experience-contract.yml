name: Akun SQ Experience Contract

on:
  pull_request:
    paths:
      - "infra/keycloak/themes/sq-hub/**"
      - "infra/keycloak/realm/sq-staff-staging-realm.json"
      - "docs/design/sq-identity-theme.md"
      - "docs/specs/HUB-IMPL-015-akun-sq-account-experience.md"
      - "docs/specs/HUB-IMPL-017-sq-hub-akun-sq-navigation-experience.md"
      - "docs/specs/HUB-IMPL-019-native-akun-sq-experience.md"
      - "apps/web/src/AccountPage.tsx"
      - "apps/web/src/AccountPage.test.tsx"
      - "apps/web/src/WorkspaceApp.tsx"
      - "apps/web/src/main.tsx"
      - "apps/api/src/modules/hub-auth/**"
      - ".github/workflows/akun-sq-experience-contract.yml"
      - "tools/visual/akun-sq-account-fixture.html"
  push:
    branches: [main]
    paths:
      - "infra/keycloak/themes/sq-hub/**"
      - "infra/keycloak/realm/sq-staff-staging-realm.json"
      - "docs/design/sq-identity-theme.md"
      - "docs/specs/HUB-IMPL-015-akun-sq-account-experience.md"
      - "docs/specs/HUB-IMPL-017-sq-hub-akun-sq-navigation-experience.md"
      - "docs/specs/HUB-IMPL-019-native-akun-sq-experience.md"
      - "apps/web/src/AccountPage.tsx"
      - "apps/web/src/AccountPage.test.tsx"
      - "apps/web/src/WorkspaceApp.tsx"
      - "apps/web/src/main.tsx"
      - "apps/api/src/modules/hub-auth/**"
      - ".github/workflows/akun-sq-experience-contract.yml"
      - "tools/visual/akun-sq-account-fixture.html"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify active Akun SQ themes
        shell: bash
        run: |
          login='infra/keycloak/themes/sq-hub/login'
          account='infra/keycloak/themes/sq-hub/account'
          grep -Fxq 'parent=keycloak.v2' "$login/theme.properties"
          grep -Fxq 'styles=css/styles.css css/akun-sq-login-a7cdc6626ac7.css' "$login/theme.properties"
          grep -Fxq 'contentHashPattern=^css/akun-sq-login-[0-9a-f]{12}[.]css$' "$login/theme.properties"
          grep -Fxq 'parent=keycloak.v3' "$account/theme.properties"
          grep -Fxq 'styles=css/akun-sq-account-148467199d0b.css' "$account/theme.properties"
          grep -Fxq 'title=Akun SQ' "$account/theme.properties"
          grep -Fxq 'logo=img/ysq-mark.png' "$account/theme.properties"
          grep -Fq 'img/ysq-mark.png' "$login/footer.ftl"
          test "$(git hash-object "$login/resources/css/akun-sq-login-a7cdc6626ac7.css" | cut -c1-12)" = a7cdc6626ac7
          grep -Fxq 'favicons.svg=img/favicon.svg' "$login/theme.properties"
          cmp -s "$login/resources/img/ysq-mark.png" apps/web/src/assets/brand/ysq-mark.png
          cmp -s "$account/resources/img/ysq-mark.png" apps/web/src/assets/brand/ysq-mark.png
          test ! -e "$login/resources/img/ysq-mark.svg"
          test ! -e "$account/resources/img/ysq-mark.svg"
          test "$(git hash-object "$account/resources/css/akun-sq-account-148467199d0b.css" | cut -c1-12)" = 148467199d0b
          test ! -e "$account/resources/css/akun-sq-account-8af415711c7c.css"
          test ! -e "$account/resources/css/akun-sq-account-959eb4c77248.css"
          test ! -e "$account/resources/css/akun-sq-account-126f6b841d90.css"

      - name: Preserve native authentication boundary
        shell: bash
        run: |
          theme='infra/keycloak/themes/sq-hub/login'
          for template in login.ftl login-reset-password.ftl login-update-password.ftl login-config-totp.ftl; do
            test ! -e "$theme/$template"
          done
          grep -Fq 'action="${url.loginAction}"' "$theme/login-otp.ftl"
          grep -Fq 'name="otp"' "$theme/login-otp.ftl"
          grep -Fq 'name="trustDevice"' "$theme/login-otp.ftl"
          grep -Fxq 'loginTitle=Akun SQ' "$theme/messages/messages_id.properties"
          grep -Fxq 'webauthn-registration-title=Tambahkan passkey' "$theme/messages/messages_id.properties"
          grep -Fxq 'passkey-doAuthenticate=Masuk dengan passkey' "$theme/messages/messages_id.properties"
          grep -Fq '#cancelWebAuthnAIA' "$theme/resources/css/akun-sq-login-a7cdc6626ac7.css"
          grep -Fxq "akunSqFooter=Satu akun untuk layanan digital Yayasan Sabilul Qur'an." "$theme/messages/messages_id.properties"
          grep -Fq '${msg("akunSqFooter")}' "$theme/footer.ftl"

      - name: Reject legacy user-facing identity brand
        shell: bash
        run: |
          legacy="$(git grep -n -I -F 'SQ Identity' -- \
            apps/web \
            infra/keycloak/themes/sq-hub \
            infra/keycloak/realm/sq-staff-staging-realm.json \
            infra/keycloak/realm/master-production-recovery.json \
            docs/product \
            docs/security || true)"
          legacy="$(printf '%s\n' "$legacy" | grep -v 'not.toContain("SQ Identity")' || true)"
          test -z "$legacy" || { printf '%s\n' "$legacy"; exit 1; }

      - name: Verify native Akun SQ account boundary
        shell: bash
        run: |
          for label in             'Profil Saya'             'Keamanan'             'Sesi & Perangkat'             'Aplikasi'             'Akun Terhubung'; do
            grep -Fq "$label" apps/web/src/AccountPage.tsx
          done
          grep -Fq 'Aplikasi SQ yang dapat Anda buka' apps/web/src/AccountPage.tsx
          grep -Fq 'Aplikasi yang terhubung ke Akun SQ' apps/web/src/AccountPage.tsx
          grep -Fq 'Keanggotaan' apps/web/src/AccountPage.tsx
          ! grep -Fq 'Keycloak' apps/web/src/AccountPage.tsx
          ! grep -Fq '/realms/' apps/web/src/AccountPage.tsx
          grep -Fq 'getAccountAccess' apps/api/src/modules/hub-auth/service.ts
          grep -Fq 'HubTokenVault' apps/api/src/modules/hub-auth/service.ts
          grep -Fq 'KeycloakAccountSelfService' apps/api/src/modules/account-self-service/client.ts
          grep -Fq 'ACCOUNT_REAUTH_REQUIRED' apps/api/src/modules/hub-auth/service.ts
          grep -Fq 'idp_link:' apps/api/src/modules/account-self-service/client.ts
          grep -Fq 'delete_credential:' apps/api/src/modules/account-self-service/client.ts
          grep -Fq 'ACCOUNT_ORIGIN_FORBIDDEN' apps/api/src/modules/hub-auth/routes.ts
          grep -Fq 'password: "UPDATE_PASSWORD"' apps/api/src/modules/hub-auth/routes.ts
          grep -Fq 'totp: "CONFIGURE_TOTP"' apps/api/src/modules/hub-auth/routes.ts
          grep -Fq '"recovery-codes": "CONFIGURE_RECOVERY_AUTHN_CODES"' apps/api/src/modules/hub-auth/routes.ts
          ! grep -Fq 'accountConsoleUrlFromIssuer' apps/api/src/modules/hub-auth/routes.ts

      - name: Reject legacy product composition from active theme
        shell: bash
        run: |
          active="$(sed -n 's/^styles=//p' infra/keycloak/themes/sq-hub/login/theme.properties)"
          case "$active" in
            *sq-identity*|*hcis*|*sq-account-41ad9ff20ec3*) exit 1 ;;
          esac
          ! grep -Fq 'Nilai Utsman' infra/keycloak/themes/sq-hub/login/footer.ftl
          ! grep -Fq 'sq-brand-values' infra/keycloak/themes/sq-hub/login/footer.ftl
          ! grep -Fqi 'SQ Identity' infra/keycloak/themes/sq-hub/login/footer.ftl
          ! grep -Fq 'grid-template-columns: minmax(0, 3fr)' infra/keycloak/themes/sq-hub/login/resources/css/akun-sq-login-a7cdc6626ac7.css

      - name: Verify rendered Akun SQ layout
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          verify_login() {
            width="$1"; height="$2"; mode="$3"
            output="/tmp/akun-sq-login-${width}x${height}-${mode}.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=1000 --window-size="$width,$height" --dump-dom "file://$PWD/tools/visual/akun-sq-login-fixture.html?mode=$mode" > "$output"
            for expected in \
              'data-horizontal="false"' \
              'data-logo-loaded="true"' \
              'data-logo-size="true"' \
              'data-primary-full="true"'; do
              grep -Fq "$expected" "$output" || {
                echo "Missing $expected in $output" >&2
                grep -oE 'data-[a-z-]+="[^"]*"' "$output" || true
                exit 1
              }
            done
            if [ "$mode" = "totp" ]; then
              grep -Fq 'data-totp-vertical="true"' "$output" || {
                echo "TOTP layout is not vertical in $output" >&2
                grep -oE 'data-[a-z-]+="[^"]*"' "$output" || true
                exit 1
              }
            fi
            if [ "$mode" = "passkey" ]; then
              grep -Fq 'data-passkey-actions="true"' "$output" || {
                echo "Passkey actions are not stacked/full-width in $output" >&2
                grep -oE 'data-[a-z-]+="[^"]*"' "$output" || true
                exit 1
              }
            fi
          }

          verify_account() {
            width="$1"; height="$2"; mode="$3"
            output="/tmp/akun-sq-account-${width}x${height}-${mode}.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=1000 --window-size="$width,$height" --dump-dom "file://$PWD/tools/visual/akun-sq-account-fixture.html?mode=$mode" > "$output"
            for expected in \
              'data-horizontal="false"' \
              'data-logo-loaded="true"' \
              'data-logo-size="true"' \
              'data-brand-text="true"' \
              'data-masthead-compact="true"' \
              'data-masthead-contained="true"' \
              'data-title-after-masthead="true"' \
              'data-toolbar-dark="false"'; do
              grep -Fq "$expected" "$output" || {
                echo "Missing $expected in $output" >&2
                grep -oE 'data-[a-z-]+="[^"]*"' "$output" || true
                exit 1
              }
            done
          }

          verify_login 320 844 login
          verify_login 360 844 login
          verify_login 390 844 login
          verify_login 412 844 login
          verify_login 768 900 login
          verify_login 1280 720 login
          verify_login 1440 900 login
          verify_login 320 844 totp
          verify_login 360 844 totp
          verify_login 390 844 totp
          verify_login 412 844 totp
          verify_login 390 844 passkey
          verify_login 1280 720 passkey

          verify_account 320 844 security
          verify_account 360 844 security
          verify_account 390 844 security
          verify_account 412 844 security
          verify_account 1440 900 overview

      - name: Capture Akun SQ structural visual evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p visual-akun-sq

          check_no_overflow() {
            width="$1"
            height="$2"
            page="$3"
            output="/tmp/akun-sq-overflow-$width-$height.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=500 --window-size="$width,$height" --dump-dom "file://$PWD/$page" > "$output"
            grep -Fq 'data-horizontal="false"' "$output"
          }

          check_no_overflow 320 844 tools/visual/akun-sq-login-fixture.html
          check_no_overflow 360 844 tools/visual/akun-sq-login-fixture.html
          check_no_overflow 390 844 tools/visual/akun-sq-login-fixture.html
          check_no_overflow 412 844 tools/visual/akun-sq-login-fixture.html
          check_no_overflow 768 900 tools/visual/akun-sq-login-fixture.html
          check_no_overflow 1280 720 tools/visual/akun-sq-login-fixture.html
          check_no_overflow 1440 900 tools/visual/akun-sq-login-fixture.html
          check_no_overflow 390 844 'tools/visual/akun-sq-account-fixture.html?mode=security'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1440,900 --screenshot=visual-akun-sq/login-desktop.png "file://$PWD/tools/visual/akun-sq-login-fixture.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=390,844 --screenshot=visual-akun-sq/login-mobile.png "file://$PWD/tools/visual/akun-sq-login-fixture.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1280,720 --screenshot=visual-akun-sq/login-invalid.png "file://$PWD/tools/visual/akun-sq-login-fixture.html?mode=invalid"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1280,720 --screenshot=visual-akun-sq/login-totp-trusted.png "file://$PWD/tools/visual/akun-sq-login-fixture.html?mode=totp"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1280,720 --screenshot=visual-akun-sq/login-forgot.png "file://$PWD/tools/visual/akun-sq-login-fixture.html?mode=forgot"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1280,720 --screenshot=visual-akun-sq/login-reset.png "file://$PWD/tools/visual/akun-sq-login-fixture.html?mode=reset"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1280,720 --screenshot=visual-akun-sq/login-passkey.png "file://$PWD/tools/visual/akun-sq-login-fixture.html?mode=passkey"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=390,844 --screenshot=visual-akun-sq/login-passkey-mobile.png "file://$PWD/tools/visual/akun-sq-login-fixture.html?mode=passkey"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1440,900 --screenshot=visual-akun-sq/account-overview.png "file://$PWD/tools/visual/akun-sq-account-fixture.html?mode=overview"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1440,900 --screenshot=visual-akun-sq/account-security.png "file://$PWD/tools/visual/akun-sq-account-fixture.html?mode=security"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1440,900 --screenshot=visual-akun-sq/account-sessions.png "file://$PWD/tools/visual/akun-sq-account-fixture.html?mode=sessions"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=390,844 --screenshot=visual-akun-sq/account-mobile.png "file://$PWD/tools/visual/akun-sq-account-fixture.html?mode=security"

          test "$(find visual-akun-sq -name '*.png' | wc -l)" -eq 10

      - name: Upload Akun SQ visual evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: akun-sq-visual-smoke
          path: visual-akun-sq/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Reject committed credentials
        shell: bash
        run: |
          ! git grep -n -E '(client_secret|access_token)[[:space:]]*=[[:space:]]*[^$<{]' -- infra/keycloak/themes tools/visual docs/specs/HUB-IMPL-015-akun-sq-account-experience.md docs/specs/HUB-IMPL-017-sq-hub-akun-sq-navigation-experience.md docs/specs/HUB-IMPL-019-native-akun-sq-experience.md
