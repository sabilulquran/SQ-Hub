name: Akun SQ Experience Contract

on:
  pull_request:
    paths:
      - "infra/keycloak/themes/sq-hub/**"
      - "infra/keycloak/realm/sq-staff-staging-realm.json"
      - "docs/design/sq-identity-theme.md"
      - "docs/specs/HUB-IMPL-015-akun-sq-account-experience.md"
      - ".github/workflows/akun-sq-experience-contract.yml"
  push:
    branches: [main]
    paths:
      - "infra/keycloak/themes/sq-hub/**"
      - "infra/keycloak/realm/sq-staff-staging-realm.json"
      - "docs/design/sq-identity-theme.md"
      - "docs/specs/HUB-IMPL-015-akun-sq-account-experience.md"
      - ".github/workflows/akun-sq-experience-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify active Akun SQ themes
        shell: bash
        run: |
          login='infra/keycloak/themes/sq-hub/login'
          account='infra/keycloak/themes/sq-hub/account'
          grep -Fxq 'parent=keycloak.v2' "$login/theme.properties"
          grep -Fxq 'styles=css/styles.css css/akun-sq-login-2629a2861483.css' "$login/theme.properties"
          grep -Fxq 'contentHashPattern=^css/akun-sq-login-[0-9a-f]{12}[.]css$' "$login/theme.properties"
          grep -Fxq 'parent=keycloak.v3' "$account/theme.properties"
          grep -Fxq 'styles=css/akun-sq-account-d4e9b269d645.css' "$account/theme.properties"
          grep -Fxq 'title=Akun SQ' "$account/theme.properties"
          grep -Fxq 'logo=img/ysq-mark.svg' "$account/theme.properties"
          grep -Fq 'img/ysq-mark.svg' "$login/footer.ftl"
          test "$(git hash-object "$login/resources/css/akun-sq-login-2629a2861483.css" | cut -c1-12)" = 2629a2861483
          grep -Fxq 'favicons.svg=img/favicon.svg' "$login/theme.properties"
          test -s "$login/resources/img/ysq-mark.svg"
          test -s "$account/resources/img/ysq-mark.svg"
          test "$(git hash-object "$account/resources/css/akun-sq-account-d4e9b269d645.css" | cut -c1-12)" = d4e9b269d645

      - name: Preserve native authentication boundary
        shell: bash
        run: |
          theme='infra/keycloak/themes/sq-hub/login'
          for template in login.ftl login-reset-password.ftl login-update-password.ftl login-config-totp.ftl; do
            test ! -e "$theme/$template"
          done
          grep -Fq 'action="${url.loginAction}"' "$theme/login-otp.ftl"
          grep -Fq 'name="otp"' "$theme/login-otp.ftl"
          grep -Fq 'name="trustDevice"' "$theme/login-otp.ftl"
          grep -Fxq 'loginTitle=Akun SQ' "$theme/messages/messages_id.properties"
          grep -Fxq "akunSqFooter=Satu akun untuk layanan digital Yayasan Sabilul Qur'an." "$theme/messages/messages_id.properties"
          grep -Fq '${msg("akunSqFooter")}' "$theme/footer.ftl"

      - name: Reject legacy product composition from active theme
        shell: bash
        run: |
          active="$(sed -n 's/^styles=//p' infra/keycloak/themes/sq-hub/login/theme.properties)"
          case "$active" in
            *sq-identity*|*hcis*|*sq-account-41ad9ff20ec3*) exit 1 ;;
          esac
          ! grep -Fq 'Nilai Utsman' infra/keycloak/themes/sq-hub/login/footer.ftl
          ! grep -Fq 'sq-brand-values' infra/keycloak/themes/sq-hub/login/footer.ftl
          ! grep -Fqi 'SQ Identity' infra/keycloak/themes/sq-hub/login/footer.ftl
          ! grep -Fq 'grid-template-columns: minmax(0, 3fr)' infra/keycloak/themes/sq-hub/login/resources/css/akun-sq-login-2629a2861483.css

      - name: Verify desktop and mobile layout
        shell: bash
        run: |
          fixture='infra/keycloak/themes/sq-hub/login/.akun-sq-layout-smoke.html'
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          cat > "$fixture" <<'HTML'
          <!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="resources/css/akun-sq-login-2629a2861483.css"></head>
          <body class="login-pf"><div class="pf-v5-c-login"><div class="pf-v5-c-login__container"><header id="kc-header"><div id="kc-header-wrapper">Akun SQ</div></header><main class="pf-v5-c-login__main"><header class="pf-v5-c-login__main-header"><h1 id="kc-page-title" class="pf-v5-c-title">Masuk ke Akun SQ</h1></header><div class="pf-v5-c-login__main-body"><div id="kc-form"><form id="kc-form-login" class="pf-v5-c-form"><div class="pf-v5-c-form__group"><label>NIP atau email</label><input type="text"></div><input id="kc-login" class="btn-primary" type="submit" value="Berikutnya"></form></div><div class="pf-v5-c-login__main-footer"><div class="pf-v5-c-login__main-footer-band"><span class="pf-v5-c-login__main-footer-band-item">Atau masuk dengan</span></div><div id="kc-social-providers"><ul class="pf-v5-c-login__main-body"><li><a id="social-google">Masuk dengan Google</a></li></ul></div></div></div><footer class="pf-v5-c-login__main-footer"><div class="sq-account-brand"><img class="sq-account-brand__logo" src="resources/img/ysq-mark.svg" alt=""><div class="sq-account-brand__copy"><strong>Akun SQ</strong><span>Yayasan Sabilul Qur'an</span></div></div><p class="sq-login-footer">Satu akun untuk layanan digital.</p></footer></main></div></div>
          <script>if(new URLSearchParams(location.search).get('mode')==='long'){const e=document.createElement('div');e.style.height='1200px';document.querySelector('.pf-v5-c-login__main-body').appendChild(e)}const d=document.documentElement,b=document.body,card=document.querySelector('.pf-v5-c-login__main').getBoundingClientRect(),google=document.querySelector('#social-google').getBoundingClientRect(),form=document.querySelector('#kc-form').getBoundingClientRect();b.dataset.vertical=String(Math.max(d.scrollHeight,b.scrollHeight)>innerHeight+1);b.dataset.horizontal=String(Math.max(d.scrollWidth,b.scrollWidth)>innerWidth+1);b.dataset.cardVisible=String(card.left>=-1&&card.right<=innerWidth+1);b.dataset.googleFirst=String(google.top<form.top)</script></body></html>
          HTML
          run_layout() {
            width="$1"; height="$2"; mode="$3"; vertical="$4"; output="/tmp/akun-sq-${width}x${height}-${mode}.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --window-size="${width},${height}" --dump-dom "file://$PWD/$fixture?mode=$mode" > "$output"
            grep -Fq "data-vertical=\"$vertical\"" "$output"
            grep -Fq 'data-horizontal="false"' "$output"
            grep -Fq 'data-card-visible="true"' "$output"
            grep -Fq 'data-google-first="true"' "$output"
          }
          run_layout 1440 900 normal false
          run_layout 1280 720 normal false
          run_layout 390 844 normal false
          run_layout 1440 900 long true
          rm -f "$fixture"

      - name: Reject committed credentials
        shell: bash
        run: |
          ! git grep -n -E '(client_secret|access_token)[[:space:]]*=[[:space:]]*[^$<{]' -- infra/keycloak/themes docs/specs/HUB-IMPL-015-akun-sq-account-experience.md
