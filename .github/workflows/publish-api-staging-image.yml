name: Publish SQ Hub API Staging Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit SHA or ref to build; use a commit SHA for pre-merge staging validation
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-api-staging-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sq-hub-api-staging-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source to build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node for API lockfile
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate API lockfile for Docker build context
        run: npm install --package-lock-only --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable API image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/imadjinasi/sq-hub-api:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish API staging image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/imadjinasi/sq-hub-api:staging
            ghcr.io/imadjinasi/sq-hub-api:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
