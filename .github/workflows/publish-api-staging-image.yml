name: Publish SQ Hub API Staging Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit SHA or ref to build; use a commit SHA for pre-merge staging validation
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-api-staging-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sq-hub-api-staging-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sq-hub-api
      OCI_SOURCE: https://github.com/${{ github.repository }}

    steps:
      - name: Check out source to build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Resolve immutable build and component source SHAs
        id: source
        shell: bash
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          component_sha="$(git log -1 --format=%H "$build_sha" -- apps/api package.json package-lock.json)"
          test -n "$component_sha"

          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"
          echo "component_sha=$component_sha" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:sha-$build_sha"
            if [ "$component_sha" != "$build_sha" ]; then
              echo "$IMAGE_NAME:sha-$component_sha"
            fi
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "$IMAGE_NAME:staging"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "build_sha=$build_sha"
          echo "component_source_sha=$component_sha"

      - name: Set up Node for API lockfile
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Validate committed workspace lockfile
        run: npm ci --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable API image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.source.outputs.tags }}
          labels: org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish API staging image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.source.outputs.tags }}
          labels: org.opencontainers.image.source=${{ env.OCI_SOURCE }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Verify immutable API component image exists
        shell: bash
        run: |
          docker buildx imagetools inspect             "$IMAGE_NAME:sha-${{ steps.source.outputs.component_sha }}" >/dev/null
          echo "API_COMPONENT_IMAGE_PUBLISH_PASS"
