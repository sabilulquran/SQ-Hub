name: TEMP Publish Go5A Candidates

on:
  push:
    branches:
      - feat/hub-admin-center-foundation
    paths:
      - ".github/workflows/temp-publish-go5a-candidates.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: ce291861a473380d9d509185c34ad5940c8d3681

      - name: Set up Node for workspace lockfile
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate workspace lockfile for Docker build context
        run: npm install --package-lock-only --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable API candidate
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/imadjinasi/sq-hub-api:sha-ce291861a473380d9d509185c34ad5940c8d3681
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish immutable web candidate
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/imadjinasi/sq-hub-web:sha-ce291861a473380d9d509185c34ad5940c8d3681
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Record immutable digests
        shell: bash
        run: |
          echo "API_DIGEST=${{ steps.api.outputs.digest }}"
          echo "WEB_DIGEST=${{ steps.web.outputs.digest }}"
