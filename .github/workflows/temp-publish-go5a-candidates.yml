name: TEMP Publish Go5A Candidates

on:
  push:
    branches:
      - feat/admin-center-access-foundation
    paths:
      - ".github/workflows/temp-publish-go5a-candidates.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: ac230bf172d4dd06883b74c52785daa23aeca0b8

      - name: Set up Node for workspace lockfile
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate workspace lockfile for Docker build context
        run: npm install --package-lock-only --ignore-scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/imadjinasi/sq-hub-api:sha-ac230bf172d4dd06883b74c52785daa23aeca0b8
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish immutable web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/imadjinasi/sq-hub-web:sha-ac230bf172d4dd06883b74c52785daa23aeca0b8
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
