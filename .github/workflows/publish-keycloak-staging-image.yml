name: Publish Keycloak Staging Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit SHA or ref to build; use a commit SHA for pre-merge staging validation
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - "infra/keycloak/**"
      - ".github/workflows/publish-keycloak-staging-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-keycloak-staging-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source to build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Keycloak image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/Containerfile
          push: true
          tags: ghcr.io/imadjinasi/sq-hub-keycloak:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      - name: Build and publish Keycloak staging image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/Containerfile
          push: true
          tags: |
            ghcr.io/imadjinasi/sq-hub-keycloak:26.7.2-staging
            ghcr.io/imadjinasi/sq-hub-keycloak:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
