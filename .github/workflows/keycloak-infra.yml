name: Keycloak Infra

on:
  pull_request:
    paths:
      - "infra/keycloak/**"
      - ".github/workflows/keycloak-infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/keycloak/**"
      - ".github/workflows/keycloak-infra.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KEYCLOAK_DB_NAME: keycloak_staging
      KEYCLOAK_DB_USERNAME: keycloak
      KEYCLOAK_DB_PASSWORD: ci-keycloak-db-password-only
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ci-bootstrap-admin
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-admin-password-only
      KEYCLOAK_DIRECTORY_CLIENT_SECRET: ci-directory-client-secret-only
      GOOGLE_CLIENT_ID: ci-google-client-id-only
      GOOGLE_CLIENT_SECRET: ci-google-client-secret-only
      KEYCLOAK_HOSTNAME: http://127.0.0.1:8080
      KEYCLOAK_HTTP_PORT: "8080"
      KEYCLOAK_MANAGEMENT_PORT: "9000"
      KEYCLOAK_MEMORY_LIMIT: 2g
      SQ_HUB_KEYCLOAK_IMAGE: sq-hub-keycloak:ci
      EDGE_NETWORK: edge_proxy
      KEYCLOAK_ENV_FILE: /tmp/keycloak-ci.env
      SQ_TRUSTED_DEVICE_SIGNING_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - uses: actions/checkout@v4

      - name: Validate realm JSON
        run: jq empty infra/keycloak/realm/sq-staff-staging-realm.json

      - name: Write CI-only env file
        shell: bash
        run: |
          cat > "$KEYCLOAK_ENV_FILE" <<EOF
          KEYCLOAK_HOSTNAME=$KEYCLOAK_HOSTNAME
          KEYCLOAK_HTTP_PORT=$KEYCLOAK_HTTP_PORT
          KEYCLOAK_MANAGEMENT_PORT=$KEYCLOAK_MANAGEMENT_PORT
          KEYCLOAK_MEMORY_LIMIT=$KEYCLOAK_MEMORY_LIMIT
          SQ_HUB_KEYCLOAK_IMAGE=$SQ_HUB_KEYCLOAK_IMAGE
          EDGE_NETWORK=$EDGE_NETWORK
          SQ_TRUSTED_DEVICE_SIGNING_KEY=$SQ_TRUSTED_DEVICE_SIGNING_KEY
          KEYCLOAK_DB_NAME=$KEYCLOAK_DB_NAME
          KEYCLOAK_DB_USERNAME=$KEYCLOAK_DB_USERNAME
          KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD
          KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME=$KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD=$KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD
          KEYCLOAK_DIRECTORY_CLIENT_SECRET=$KEYCLOAK_DIRECTORY_CLIENT_SECRET
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          EOF
          chmod 600 "$KEYCLOAK_ENV_FILE"

      - name: Validate compose rendering
        run: |
          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            config > /tmp/keycloak-compose.yml

      - name: Prepare shared edge network
        run: |
          docker network inspect "$EDGE_NETWORK" >/dev/null 2>&1 \
            || docker network create "$EDGE_NETWORK"

      - name: Build and start Keycloak smoke stack
        run: |
          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            up -d --build

      - name: Wait for Keycloak readiness
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health/ready > /tmp/keycloak-health.json; then
              ready=1
              break
            fi
            sleep 5
          done
          if [[ "$ready" != "1" ]]; then
            docker compose \
              --env-file "$KEYCLOAK_ENV_FILE" \
              -f infra/keycloak/docker-compose.staging.yml \
              -f infra/keycloak/docker-compose.bootstrap.yml \
              logs keycloak
            exit 1
          fi
          jq -e '.status == "UP"' /tmp/keycloak-health.json

      - name: Verify OIDC issuer
        run: |
          curl --fail --silent \
            http://127.0.0.1:8080/realms/sq-staff-staging/.well-known/openid-configuration \
            > /tmp/discovery.json
          jq -e '.issuer == "http://127.0.0.1:8080/realms/sq-staff-staging"' /tmp/discovery.json

      - name: Verify Akun SQ login theme
        shell: bash
        run: |
          status="$(curl --silent --show-error \
            --output /tmp/akun-sq-login.html \
            --write-out '%{http_code}' \
            --header 'Accept-Language: en-US,en;q=0.9' \
            --get \
            --data-urlencode 'client_id=hcis-staging' \
            --data-urlencode 'response_type=code' \
            --data-urlencode 'scope=openid' \
            --data-urlencode 'redirect_uri=https://hcis-staging.sabilulquran.or.id/auth/callback' \
            --data-urlencode 'code_challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            --data-urlencode 'code_challenge_method=S256' \
            http://127.0.0.1:8080/realms/sq-staff-staging/protocol/openid-connect/auth)"
          test "$status" = "200"
          grep -Fq 'Akun SQ' /tmp/akun-sq-login.html
          grep -Fq 'Masuk ke Akun SQ' /tmp/akun-sq-login.html
          grep -Fq 'css/akun-sq-login-be6b1a63ccf6.css' /tmp/akun-sq-login.html
          ! grep -Fq 'css/sq-account-hcis-d8e0fab49a38.css' /tmp/akun-sq-login.html
          ! grep -Fq 'css/sq-identity-066c6982e041.css' /tmp/akun-sq-login.html
          ! grep -Fq 'css/sq-account-41ad9ff20ec3.css' /tmp/akun-sq-login.html
          ! grep -Fq 'css/sq-identity-615a8687ea40.css' /tmp/akun-sq-login.html
          ! grep -Fq 'css/sq-hub.css' /tmp/akun-sq-login.html
          ! grep -Fq 'css/sq-account-hcis-5ae1544133ef.css' /tmp/akun-sq-login.html
          ! grep -Fq 'css/hcis-logo-assets-294b82789923.css' /tmp/akun-sq-login.html
          grep -Fq 'img/favicon.svg' /tmp/akun-sq-login.html
          grep -Fq 'img/ysq-mark.png' /tmp/akun-sq-login.html

          mark_src="$(grep -oE 'src="[^"]*img/ysq-mark[.]png"' /tmp/akun-sq-login.html | head -n 1 | cut -d'"' -f2)"
          test -n "$mark_src"
          case "$mark_src" in
            http://127.0.0.1:8080/*) login_mark_url="$mark_src" ;;
            /*) login_mark_url="http://127.0.0.1:8080$mark_src" ;;
            *) echo "Unexpected Akun SQ mark resource URL: $mark_src" >&2; exit 1 ;;
          esac

          curl --fail --silent "$login_mark_url" --output /tmp/keycloak-login-ysq-mark.png
          cmp -s /tmp/keycloak-login-ysq-mark.png infra/keycloak/themes/sq-hub/login/resources/img/ysq-mark.png

          account_mark_src="${mark_src/\/login\//\/account\/}"
          test "$account_mark_src" != "$mark_src"
          case "$account_mark_src" in
            http://127.0.0.1:8080/*) account_mark_url="$account_mark_src" ;;
            /*) account_mark_url="http://127.0.0.1:8080$account_mark_src" ;;
            *) echo "Unexpected Akun SQ account mark resource URL: $account_mark_src" >&2; exit 1 ;;
          esac
          curl --fail --silent "$account_mark_url" --output /tmp/keycloak-account-ysq-mark.png
          cmp -s /tmp/keycloak-account-ysq-mark.png infra/keycloak/themes/sq-hub/account/resources/img/ysq-mark.png

      - name: Verify imported realm policy and clients
        shell: bash
        run: |
          token="$({
            curl --fail --silent \
              --data-urlencode "client_id=admin-cli" \
              --data-urlencode "username=$KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME" \
              --data-urlencode "password=$KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD" \
              --data-urlencode "grant_type=password" \
              http://127.0.0.1:8080/realms/master/protocol/openid-connect/token
          } | jq -r '.access_token')"
          test -n "$token"
          test "$token" != "null"

          curl --fail --silent \
            -H "Authorization: Bearer $token" \
            http://127.0.0.1:8080/admin/realms/sq-staff-staging \
            > /tmp/realm.json

          jq -e '
            .realm == "sq-staff-staging" and
            .displayName == "Akun SQ" and
            .registrationAllowed == false and
            .rememberMe == false and
            .resetPasswordAllowed == true and
            .loginWithEmailAllowed == true and
            .duplicateEmailsAllowed == false and
            .internationalizationEnabled == true and
            .defaultLocale == "id" and
            .supportedLocales == ["id"] and
            .bruteForceProtected == true and
            .failureFactor == 5 and
            .passwordPolicy == "length(12) and notUsername" and
            .ssoSessionIdleTimeout == 28800 and
            .ssoSessionMaxLifespan == 43200 and
            .accessTokenLifespan == 300 and
            .loginTheme == "sq-hub" and
            .accountTheme == "sq-hub"
          ' /tmp/realm.json

          for client_id in hcis-staging sq-hub-api-staging hcis-api-staging; do
            curl --fail --silent \
              -H "Authorization: Bearer $token" \
              "http://127.0.0.1:8080/admin/realms/sq-staff-staging/clients?clientId=$client_id" \
              > "/tmp/client-$client_id.json"
            jq -e 'length == 1' "/tmp/client-$client_id.json"
          done

          jq -e '.[0].standardFlowEnabled == true and .[0].directAccessGrantsEnabled == false' \
            /tmp/client-hcis-staging.json
          jq -e '.[0].bearerOnly == true' /tmp/client-sq-hub-api-staging.json
          jq -e '.[0].serviceAccountsEnabled == true and .[0].directAccessGrantsEnabled == false' \
            /tmp/client-hcis-api-staging.json

      - name: Reconcile and verify recovery and Google broker safety
        shell: bash
        run: |
          kcadm_config=/tmp/sq-hub-identity-ux-ci.kcadm

          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            exec -T keycloak \
            sh -ceu '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --config "$1" \
                --server http://127.0.0.1:8080 \
                --realm master \
                --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
            ' sh "$kcadm_config"

          for pass in first second; do
            output="$(
              KEYCLOAK_REALM=sq-staff-staging \
              KEYCLOAK_KCADM_CONFIG="$kcadm_config" \
                bash infra/keycloak/scripts/reconcile-identity-recovery-google.sh
            )"
            printf '%s\n' "$output"
            grep -Fxq FORGOT_PASSWORD_CONFIGURATION_PASS <<<"$output"
            grep -Fxq EMAIL_ALTERNATE_LOGIN_CONFIGURATION_PASS <<<"$output"
            grep -Fxq GOOGLE_EXISTING_ACCOUNT_LINK_ONLY_PASS <<<"$output"
            grep -Fxq GOOGLE_CONDITIONAL_MFA_PASS <<<"$output"
            grep -Fxq GOOGLE_PROVIDER_CONFIGURATION_PASS <<<"$output"
          done

          curl --fail --silent \
            --get \
            --data-urlencode 'client_id=hcis-staging' \
            --data-urlencode 'response_type=code' \
            --data-urlencode 'scope=openid' \
            --data-urlencode 'redirect_uri=https://hcis-staging.sabilulquran.or.id/auth/callback' \
            --data-urlencode 'code_challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            --data-urlencode 'code_challenge_method=S256' \
            http://127.0.0.1:8080/realms/sq-staff-staging/protocol/openid-connect/auth \
            > /tmp/akun-sq-identity-ux.html

          grep -Fq 'Lupa password?' /tmp/akun-sq-identity-ux.html
          grep -Fq 'Masuk dengan Google' /tmp/akun-sq-identity-ux.html
          ! grep -Fq "$GOOGLE_CLIENT_SECRET" /tmp/akun-sq-identity-ux.html

          first_flow="$({
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get \
              'authentication/flows/akun-sq-google-existing-account-link/executions' \
              -r sq-staff-staging --config "$kcadm_config"
          })"
          jq -e '
            length == 3 and
            ([.[] | select(.providerId == "idp-create-user-if-unique" or .providerId == "idp-auto-link")] | length) == 0
          ' >/dev/null <<<"$first_flow"

          google_provider="$({
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get identity-provider/instances/google \
              -r sq-staff-staging --config "$kcadm_config"
          })"
          jq -e '
            .storeToken == false and .addReadTokenRoleOnCreate == false and
            .config.syncMode == "IMPORT"
          ' >/dev/null <<<"$google_provider"

          unset first_flow google_provider output
          rm -f /tmp/akun-sq-identity-ux.html
          docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
            exec -T keycloak rm -f "$kcadm_config"

      - name: Reconcile and verify recovery-code prerequisites
        shell: bash
        run: |
          kcadm_config=/tmp/sq-hub-recovery-codes-ci.kcadm

          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            exec -T keycloak \
            sh -ceu '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --config "$1" \
                --server http://127.0.0.1:8080 \
                --realm master \
                --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
            ' sh "$kcadm_config"

          first_output="$(KEYCLOAK_KCADM_CONFIG="$kcadm_config" bash infra/keycloak/scripts/reconcile-recovery-codes.sh)"
          printf '%s\n' "$first_output"
          second_output="$(KEYCLOAK_KCADM_CONFIG="$kcadm_config" bash infra/keycloak/scripts/reconcile-recovery-codes.sh)"
          printf '%s\n' "$second_output"

          expected_second_output="$(printf '%s\n' \
            RECOVERY_REQUIRED_ACTION_ENABLED_PASS \
            RECOVERY_BROWSER_FLOW_ALTERNATIVE_PASS \
            OTP_BROWSER_FLOW_ALTERNATIVE_PASS \
            RECOVERY_RECONCILE_IDEMPOTENT_PASS)"
          test "$second_output" = "$expected_second_output"

          required_action_json="$(
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get \
              authentication/required-actions/CONFIGURE_RECOVERY_AUTHN_CODES \
              -r sq-staff-staging --config "$kcadm_config"
          )"
          jq -e '
            .alias == "CONFIGURE_RECOVERY_AUTHN_CODES" and
            .providerId == "CONFIGURE_RECOVERY_AUTHN_CODES" and
            .enabled == true and .defaultAction == false
          ' >/dev/null <<<"$required_action_json"

          realm_json="$(
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get realms/sq-staff-staging \
              --config "$kcadm_config"
          )"
          browser_flow="$(jq -er '.browserFlow | select(type == "string" and length > 0)' <<<"$realm_json")"
          executions_json="$(
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/$browser_flow/executions" -r sq-staff-staging \
              --config "$kcadm_config"
          )"
          jq -e '
            ([.[] | select(.providerId == "auth-recovery-authn-code-form" and .requirement == "ALTERNATIVE")] | length) == 1 and
            ([.[] | select(.providerId == "auth-otp-form" and .requirement == "ALTERNATIVE")] | length) == 1
          ' >/dev/null <<<"$executions_json"

          docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
            exec -T keycloak rm -f "$kcadm_config"

      - name: Reconcile and verify native account self-service scope
        shell: bash
        run: |
          kcadm_config=/tmp/sq-hub-native-account-ci.kcadm

          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            exec -T keycloak \
            sh -ceu '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --config "$1" \
                --server http://127.0.0.1:8080 \
                --realm master \
                --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
            ' sh "$kcadm_config"

          for pass in first second; do
            output="$(
              KEYCLOAK_REALM=sq-staff-staging \
              SQ_HUB_CLIENT_ID=sq-hub-staging \
              KEYCLOAK_KCADM_CONFIG="$kcadm_config" \
              KEYCLOAK_ENV_FILE="$KEYCLOAK_ENV_FILE" \
                bash infra/keycloak/scripts/reconcile-native-account-self-service.sh
            )"
            printf '%s\n' "$output"
            grep -Fq 'NATIVE_ACCOUNT_SCOPE_MAPPING_PASS realm=sq-staff-staging client=sq-hub-staging' <<<"$output"
            grep -Fq 'NATIVE_ACCOUNT_AUDIENCE_PASS realm=sq-staff-staging client=sq-hub-staging audience=account' <<<"$output"
          done

          hub_uuid="$(
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get clients \
              -r sq-staff-staging -q clientId=sq-hub-staging --config "$kcadm_config" \
              | jq -er 'if length == 1 then .[0].id else error("Hub client ambiguous") end'
          )"
          account_uuid="$(
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get clients \
              -r sq-staff-staging -q clientId=account --config "$kcadm_config" \
              | jq -er 'if length == 1 then .[0].id else error("account client ambiguous") end'
          )"

          mapped="$(
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get \
              "clients/$hub_uuid/scope-mappings/clients/$account_uuid" \
              -r sq-staff-staging --config "$kcadm_config"
          )"
          jq -e '
            ([.[].name] | sort) ==
            ([
              "manage-account",
              "manage-account-links",
              "manage-consent",
              "view-applications",
              "view-consent",
              "view-groups",
              "view-profile"
            ] | sort)
          ' >/dev/null <<<"$mapped"

          docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
            exec -T keycloak rm -f "$kcadm_config"

      - name: Reconcile and verify least-privilege directory client
        shell: bash
        run: |
          kcadm_config=/tmp/sq-hub-directory-ci.kcadm

          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            exec -T keycloak \
            sh -ceu '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --config "$1" \
                --server http://127.0.0.1:8080 \
                --realm master \
                --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
            ' sh "$kcadm_config"

          first_output="$(
            KEYCLOAK_KCADM_CONFIG="$kcadm_config" \
            KEYCLOAK_DIRECTORY_CLIENT_SECRET="$KEYCLOAK_DIRECTORY_CLIENT_SECRET" \
              bash infra/keycloak/scripts/reconcile-directory-client.sh
          )"
          printf '%s\n' "$first_output"
          second_output="$(
            KEYCLOAK_KCADM_CONFIG="$kcadm_config" \
            KEYCLOAK_DIRECTORY_CLIENT_SECRET="$KEYCLOAK_DIRECTORY_CLIENT_SECRET" \
              bash infra/keycloak/scripts/reconcile-directory-client.sh
          )"
          printf '%s\n' "$second_output"

          expected_output="$(printf '%s\n' \
            DIRECTORY_CLIENT_CONFIGURATION_PASS \
            DIRECTORY_CLIENT_LEAST_PRIVILEGE_PASS)"
          test "$first_output" = "$expected_output"
          test "$second_output" = "$expected_output"

          synthetic_user_id="$(
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh create users \
              -r sq-staff-staging \
              -s username=ci-directory-smoke \
              -s enabled=true \
              -s firstName=CI \
              -s lastName=Directory \
              -i \
              --config "$kcadm_config"
          )"
          test -n "$synthetic_user_id"

          directory_token="$(
            {
              printf 'client_id=%s&' 'sq-hub-directory-staging'
              printf 'client_secret=%s&' "$(printf '%s' "$KEYCLOAK_DIRECTORY_CLIENT_SECRET" | jq -sRr @uri)"
              printf 'grant_type=client_credentials'
            } | curl --fail --silent \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-binary @- \
              http://127.0.0.1:8080/realms/sq-staff-staging/protocol/openid-connect/token \
              | jq -er '.access_token'
          )"

          curl --fail --silent \
            -H "Authorization: Bearer $directory_token" \
            'http://127.0.0.1:8080/admin/realms/sq-staff-staging/users?search=ci-directory-smoke&max=10&briefRepresentation=false' \
            > /tmp/directory-users.json
          jq -e 'type == "array" and length == 1 and .[0].username == "ci-directory-smoke"' /tmp/directory-users.json

          curl --fail --silent \
            -H "Authorization: Bearer $directory_token" \
            "http://127.0.0.1:8080/admin/realms/sq-staff-staging/users/$synthetic_user_id" \
            > /tmp/directory-user.json
          jq -e '.id != null and .username == "ci-directory-smoke"' /tmp/directory-user.json

          unset directory_token synthetic_user_id
          rm -f /tmp/directory-users.json /tmp/directory-user.json
          docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
            exec -T keycloak rm -f "$kcadm_config"

      - name: Verify backup and disposable restore
        run: |
          bash infra/keycloak/scripts/backup.sh /tmp/keycloak-ci.dump
          bash infra/keycloak/scripts/restore-check.sh /tmp/keycloak-ci.dump

      - name: Reconcile and verify trusted-device authentication flows
        shell: bash
        run: |
          kcadm_config=/tmp/sq-hub-trusted-device-ci.kcadm
          google_post_flow='ci-google-conditional-mfa'

          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            exec -T keycloak \
            sh -ceu '
              /opt/keycloak/bin/kcadm.sh config credentials \
                --config "$1" \
                --server http://127.0.0.1:8080 \
                --realm master \
                --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null
            ' sh "$kcadm_config"

          providers="$({
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get authentication/authenticator-providers \
              -r sq-staff-staging --config "$kcadm_config"
          })"
          jq -e '([.[] | select(.id == "sq-trusted-device-otp")] | length) == 1' \
            >/dev/null <<<"$providers"

          docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
            exec -T keycloak /opt/keycloak/bin/kcadm.sh create authentication/flows \
            -r sq-staff-staging -s "alias=$google_post_flow" -s providerId=basic-flow \
            -s topLevel=true -s builtIn=false --config "$kcadm_config" >/dev/null
          docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
            exec -T keycloak /opt/keycloak/bin/kcadm.sh create \
            "authentication/flows/$google_post_flow/executions/execution" \
            -r sq-staff-staging -s provider=auth-otp-form --config "$kcadm_config" >/dev/null

          google_executions="$({
            docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
              exec -T keycloak /opt/keycloak/bin/kcadm.sh get \
              "authentication/flows/$google_post_flow/executions" \
              -r sq-staff-staging --config "$kcadm_config"
          })"
          google_otp="$(jq '.[] | select(.providerId == "auth-otp-form") | .requirement = "REQUIRED"' \
            <<<"$google_executions")"
          printf '%s' "$google_otp" | docker compose --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml exec -T keycloak \
            /opt/keycloak/bin/kcadm.sh update "authentication/flows/$google_post_flow/executions" \
            -r sq-staff-staging -n -f - --config "$kcadm_config" >/dev/null

          for pass in first second; do
            output="$(
              KEYCLOAK_REALM=sq-staff-staging \
              KEYCLOAK_KCADM_CONFIG="$kcadm_config" \
              KEYCLOAK_GOOGLE_POST_FLOW_ALIAS="$google_post_flow" \
                bash infra/keycloak/scripts/reconcile-trusted-device.sh
            )"
            printf '%s\n' "$output"
            grep -Fxq TRUSTED_DEVICE_BROWSER_FLOW_PASS <<<"$output"
            grep -Fxq TRUSTED_DEVICE_GOOGLE_POST_FLOW_PASS <<<"$output"
            grep -Fxq TRUSTED_DEVICE_RECONCILE_IDEMPOTENT_PASS <<<"$output"
          done

          unset providers google_executions google_otp output
          docker compose --env-file "$KEYCLOAK_ENV_FILE" -f infra/keycloak/docker-compose.staging.yml \
            exec -T keycloak rm -f "$kcadm_config"

      - name: Reject committed Keycloak secrets
        shell: bash
        run: |
          if grep -R -n -E '"secret"[[:space:]]*:[[:space:]]*"[^$][^"]+"' infra/keycloak/realm; then
            echo "A client secret appears to be committed in realm configuration." >&2
            exit 1
          fi

      - name: Show service status on failure
        if: failure()
        run: |
          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            ps || true
          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            logs --no-color keycloak keycloak-db || true

      - name: Tear down smoke stack
        if: always()
        run: |
          docker compose \
            --env-file "$KEYCLOAK_ENV_FILE" \
            -f infra/keycloak/docker-compose.staging.yml \
            -f infra/keycloak/docker-compose.bootstrap.yml \
            down -v || true
          docker network rm "$EDGE_NETWORK" >/dev/null 2>&1 || true
