services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQ_HUB_DB_NAME:?set SQ_HUB_DB_NAME}
      POSTGRES_USER: ${SQ_HUB_DB_USER:?set SQ_HUB_DB_USER}
      POSTGRES_PASSWORD: ${SQ_HUB_DB_PASSWORD:?set SQ_HUB_DB_PASSWORD}
    volumes:
      - sq_hub_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQ_HUB_DB_USER} -d ${SQ_HUB_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    mem_limit: ${SQ_HUB_DB_MEMORY_LIMIT:-160m}

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${SQ_HUB_API_IMAGE:-ghcr.io/imadjinasi/sq-hub-api:staging}
    restart: unless-stopped
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://${SQ_HUB_DB_USER}:${SQ_HUB_DB_PASSWORD}@postgres:5432/${SQ_HUB_DB_NAME}
      HCIS_CANONICAL_URL: ${HCIS_CANONICAL_URL:-https://hcis-staging.sabilulquran.or.id}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://login-staging.sabilulquran.or.id/realms/sq-staff-staging}
      MACHINE_TOKEN_AUDIENCE: ${MACHINE_TOKEN_AUDIENCE:-sq-hub-api-staging}
      ALLOWED_MACHINE_CLIENTS: ${ALLOWED_MACHINE_CLIENTS:-hcis-api-staging}
    command:
      - sh
      - -c
      - node apps/api/dist/db/migrate.js && node apps/api/dist/db/seed.js && exec node apps/api/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3100"
    ports:
      - "${SQ_HUB_BIND_ADDRESS:-127.0.0.1}:${SQ_HUB_HTTP_PORT:-18100}:3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      backend:
      sq_platform_staging:
        aliases:
          - sq-hub-api-staging
    mem_limit: ${SQ_HUB_API_MEMORY_LIMIT:-128m}

networks:
  backend:
    internal: true
  sq_platform_staging:
    external: true
    name: ${SQ_PLATFORM_STAGING_NETWORK:-sq_platform_staging}

volumes:
  sq_hub_staging_pgdata:
