services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQ_HUB_DB_NAME:?set SQ_HUB_DB_NAME}
      POSTGRES_USER: ${SQ_HUB_DB_USER:?set SQ_HUB_DB_USER}
      POSTGRES_PASSWORD: ${SQ_HUB_DB_PASSWORD:?set SQ_HUB_DB_PASSWORD}
    volumes:
      - sq_hub_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQ_HUB_DB_USER} -d ${SQ_HUB_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    mem_limit: ${SQ_HUB_DB_MEMORY_LIMIT:-160m}

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ${SQ_HUB_API_IMAGE:-ghcr.io/imadjinasi/sq-hub-api:staging}
    restart: unless-stopped
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://${SQ_HUB_DB_USER}:${SQ_HUB_DB_PASSWORD}@postgres:5432/${SQ_HUB_DB_NAME}
      HCIS_CANONICAL_URL: ${HCIS_CANONICAL_URL:-https://hcis-staging.sabilulquran.or.id}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://login.sabilulquran.or.id/realms/sq-staff-staging}
      MACHINE_TOKEN_AUDIENCE: ${MACHINE_TOKEN_AUDIENCE:-sq-hub-api-staging}
      ALLOWED_MACHINE_CLIENTS: ${ALLOWED_MACHINE_CLIENTS:-hcis-api-staging}
      SQ_HUB_OIDC_CLIENT_ID: ${SQ_HUB_OIDC_CLIENT_ID:-sq-hub-staging}
      SQ_HUB_OIDC_CLIENT_SECRET: ${SQ_HUB_OIDC_CLIENT_SECRET:?set SQ_HUB_OIDC_CLIENT_SECRET}
      SQ_HUB_OIDC_REDIRECT_URI: ${SQ_HUB_OIDC_REDIRECT_URI:-https://hub-staging.sabilulquran.or.id/auth/callback}
      SQ_HUB_OIDC_POST_LOGOUT_REDIRECT_URI: ${SQ_HUB_OIDC_POST_LOGOUT_REDIRECT_URI:-https://hub-staging.sabilulquran.or.id/}
      HUB_SESSION_IDLE_HOURS: ${HUB_SESSION_IDLE_HOURS:-8}
      HUB_SESSION_MAX_HOURS: ${HUB_SESSION_MAX_HOURS:-12}
      HUB_OIDC_TRANSACTION_TTL_MINUTES: ${HUB_OIDC_TRANSACTION_TTL_MINUTES:-10}
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-true}
      KEYCLOAK_DIRECTORY_BASE_URL: ${KEYCLOAK_DIRECTORY_BASE_URL:-http://sq-identity-directory-staging:8080}
      KEYCLOAK_DIRECTORY_REALM: ${KEYCLOAK_DIRECTORY_REALM:-sq-staff-staging}
      KEYCLOAK_DIRECTORY_CLIENT_ID: ${KEYCLOAK_DIRECTORY_CLIENT_ID:-sq-hub-directory-staging}
      KEYCLOAK_DIRECTORY_CLIENT_SECRET: ${KEYCLOAK_DIRECTORY_CLIENT_SECRET:?set KEYCLOAK_DIRECTORY_CLIENT_SECRET}
    command:
      - sh
      - -c
      - node apps/api/dist/db/migrate.js && node apps/api/dist/db/seed.js && exec node apps/api/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3100"
    ports:
      - "${SQ_HUB_BIND_ADDRESS:-127.0.0.1}:${SQ_HUB_HTTP_PORT:-18100}:3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      backend:
      sq_platform_staging:
        aliases:
          - sq-hub-api-staging
      sq_identity_directory_staging:
    mem_limit: ${SQ_HUB_API_MEMORY_LIMIT:-128m}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ${SQ_HUB_WEB_IMAGE:-ghcr.io/imadjinasi/sq-hub-web:staging}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SQ_HUB_BIND_ADDRESS:-127.0.0.1}:${SQ_HUB_WEB_HTTP_PORT:-18101}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
    mem_limit: ${SQ_HUB_WEB_MEMORY_LIMIT:-64m}

networks:
  backend:
    internal: true
  sq_platform_staging:
    external: true
    name: ${SQ_PLATFORM_STAGING_NETWORK:-sq_platform_staging}
  sq_identity_directory_staging:
    external: true
    name: ${SQ_IDENTITY_DIRECTORY_STAGING_NETWORK:-sq_identity_directory_staging}

volumes:
  sq_hub_staging_pgdata:
