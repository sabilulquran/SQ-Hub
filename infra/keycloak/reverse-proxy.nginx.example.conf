# Example server/location configuration for login.sabilulquran.or.id.
# TLS certificate provisioning remains the responsibility of the VPS reverse proxy.
# The Keycloak backend is bound to 127.0.0.1:8080 by docker-compose.staging.yml.

server {
    listen 443 ssl;
    server_name login.sabilulquran.or.id;

    # Configure certificate paths using the existing VPS TLS/ACME setup.
    # ssl_certificate ...;
    # ssl_certificate_key ...;

    # Do not expose Keycloak Administration REST/UI on the public login host.
    location ^~ /admin/ {
        return 404;
    }

    # The master realm is only for Keycloak administration/bootstrap and is not
    # an authentication realm for SQ Hub applications.
    location ^~ /realms/master/ {
        return 404;
    }

    # Health and metrics are bound separately to localhost:9000 and must not be proxied publicly.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Overwrite forwarded identity headers; do not append untrusted client values.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Original-Forwarded-For "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Original-Method "";
        proxy_set_header X-Forwarded-Access-Token "";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
