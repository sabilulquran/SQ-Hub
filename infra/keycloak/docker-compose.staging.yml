services:
  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?set KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:?set KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KEYCLOAK_DB_USERNAME:?set KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB_NAME:?set KEYCLOAK_DB_NAME}
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak_staging_postgres:/var/lib/postgresql/data
    networks:
      - sq_identity_internal
    mem_limit: ${KEYCLOAK_DB_MEMORY_LIMIT:-192m}

  keycloak:
    build:
      context: ../..
      dockerfile: infra/keycloak/Containerfile
    image: ${SQ_HUB_KEYCLOAK_IMAGE:?set SQ_HUB_KEYCLOAK_IMAGE}
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:?set KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?set KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_SPI_REQUIRED_ACTION__CONFIGURE_TOTP__ADD_RECOVERY_CODES: "true"
      SQ_TRUSTED_DEVICE_SIGNING_KEY: ${SQ_TRUSTED_DEVICE_SIGNING_KEY:-}
    command:
      - start
      - --optimized
      - --import-realm
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-768m}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; }
          0<>/dev/tcp/localhost/9000
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      sq_identity_internal:
      edge_proxy:
        aliases:
          - sq-identity-staging
      sq_identity_directory_staging:
        aliases:
          - sq-identity-directory-staging

networks:
  sq_identity_internal:
    driver: bridge
  edge_proxy:
    external: true
    name: ${EDGE_NETWORK:-edge_proxy}
  sq_identity_directory_staging:
    name: ${SQ_IDENTITY_DIRECTORY_STAGING_NETWORK:-sq_identity_directory_staging}
    driver: bridge
    internal: true

volumes:
  keycloak_staging_postgres:
