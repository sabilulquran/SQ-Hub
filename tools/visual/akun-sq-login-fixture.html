<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Akun SQ visual fixture</title>
  <link rel="stylesheet" href="../../infra/keycloak/themes/sq-hub/login/resources/css/akun-sq-login-040ef6d18eac.css">
</head>
<body class="login-pf">
  <div class="pf-v5-c-login">
    <div class="pf-v5-c-login__container">
      <main class="pf-v5-c-login__main">
        <footer class="pf-v5-c-login__main-footer">
          <div class="sq-account-brand" aria-label="Islamic Tahfizh School Sabilul Qur'an">
            <picture>
              <source srcset="../../infra/keycloak/themes/sq-hub/login/resources/img/logo-white.png" media="(prefers-color-scheme: dark)">
              <img
                class="sq-account-brand__logo"
                src="../../infra/keycloak/themes/sq-hub/login/resources/img/logo.png"
                alt=""
                aria-hidden="true"
                width="2240"
                height="721"
              >
            </picture>
          </div>
          <p class="sq-login-footer">Satu akun untuk layanan digital Yayasan Sabilul Qur'an.</p>
        </footer>
        <header class="pf-v5-c-login__main-header">
          <h1 id="kc-page-title" class="pf-v5-c-title">Masuk ke Akun SQ</h1>
        </header>
        <div class="pf-v5-c-login__main-body">
          <div id="fixture-state"></div>
        </div>
      </main>
    </div>
  </div>
  <script>
    const mode = new URLSearchParams(location.search).get("mode") || "login";
    const state = document.querySelector("#fixture-state");
    const title = document.querySelector("#kc-page-title");
    const field = (label, type = "text", value = "", id = "") =>
      '<div class="pf-v5-c-form__group"><label' + (id ? ' for="' + id + '"' : '') + '>' + label + '</label>' +
      '<input class="form-control" ' + (id ? 'id="' + id + '" name="' + id + '" ' : '') +
      'type="' + type + '" value="' + value + '"></div>';
    const passwordField = (label, id) =>
      '<div class="pf-v5-c-form__group"><div class="pf-v5-c-form__group-label"><label class="pf-v5-c-form__label" for="' + id + '">' +
      '<span class="pf-v5-c-form__label-text">' + label + '</span></label></div>' +
      '<div class="pf-v5-c-input-group"><div class="pf-v5-c-input-group__item pf-m-fill"><span class="pf-v5-c-form-control">' +
      '<input id="' + id + '" name="' + id + '" type="password" value=""></span></div>' +
      '<div class="pf-v5-c-input-group__item"><button class="pf-v5-c-button pf-m-control" type="button" aria-label="Tampilkan kata sandi">' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>' +
      '</button></div></div></div>';
    const attemptedUsername = (value) =>
      '<div class="pf-v5-c-form__group"><div class="pf-v5-c-form__group-label"><label class="pf-v5-c-form__label" for="username">' +
      '<span class="pf-v5-c-form__label-text">NIP atau email</span></label></div>' +
      '<div class="pf-v5-c-input-group"><div class="pf-v5-c-input-group__item pf-m-fill"><span class="pf-v5-c-form-control pf-m-readonly">' +
      '<input id="kc-attempted-username" value="' + value + '" readonly></span></div>' +
      '<div class="pf-v5-c-input-group__item"><button id="reset-login" class="pf-v5-c-button pf-m-control kc-login-tooltip" type="button" aria-label="Ganti akun">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg>' +
      '<span class="kc-tooltip-text">Ganti akun</span></button></div></div></div>';
    const submit = (label) =>
      '<button id="kc-login" class="pf-v5-c-button pf-m-primary" type="button">' + label + '</button>';
    const form = (body, id = "kc-form-login") =>
      '<form id="' + id + '" class="pf-v5-c-form">' + body + '</form>';

    if (mode === "invalid") {
      state.innerHTML =
        '<div class="pf-v5-c-alert pf-m-danger">NIP/email atau kata sandi tidak sesuai.</div>' +
        form(field("NIP atau email", "text", "UAT-HCIS-001", "username") +
          passwordField("Kata sandi", "password") +
          '<div id="kc-form-buttons">' + submit("Masuk") + '</div>');
    } else if (mode === "totp") {
      title.textContent = "Masukkan kode";
      state.innerHTML = form(
        attemptedUsername("198701012010011001") +
        field("Kode 6 angka dari aplikasi autentikator", "text", "", "otp") +
        '<div class="pf-v5-c-form__group"><label for="trustDevice">' +
        '<input id="trustDevice" name="trustDevice" type="checkbox"> Ingat perangkat ini selama 30 hari' +
        '</label></div>' +
        '<div id="kc-form-buttons">' + submit("Verifikasi") + '</div>',
        "kc-otp-login-form"
      );
    } else if (mode === "forgot") {
      title.textContent = "Lupa kata sandi";
      state.innerHTML =
        '<p class="instruction">Masukkan NIP atau email untuk melanjutkan pemulihan.</p>' +
        form(field("NIP atau email", "text", "", "username") +
          '<div id="kc-form-buttons">' + submit("Kirim") + '</div>');
    } else if (mode === "reset") {
      title.textContent = "Buat kata sandi baru";
      state.innerHTML = form(
        field("Kata sandi baru", "password", "", "password-new") +
        field("Ulangi kata sandi baru", "password", "", "password-confirm") +
        '<div id="kc-form-buttons">' + submit("Simpan") + '</div>'
      );
    } else if (mode === "passkey") {
      title.textContent = "Tambahkan passkey";
      state.innerHTML =
        '<p class="instruction">Gunakan passkey untuk masuk dengan aman pada perangkat yang mendukung.</p>' +
        '<form id="register" class="pf-v5-c-form"></form>' +
        '<input type="submit" class="pf-v5-c-button pf-m-primary" id="registerWebAuthn" value="Tambahkan passkey">' +
        '<form id="kc-webauthn-settings-form" class="pf-v5-c-form">' +
        '<button type="button" class="pf-v5-c-button pf-m-secondary" id="cancelWebAuthnAIA">Batal</button>' +
        '</form>';
    } else {
      state.innerHTML =
        '<div class="pf-v5-c-login__main-footer">' +
        '<div id="kc-social-providers"><ul><li><a id="social-google">Masuk dengan Google</a></li></ul></div>' +
        '<div class="pf-v5-c-login__main-footer-band"><span class="pf-v5-c-login__main-footer-band-item">Atau</span></div>' +
        '</div>' +
        '<div id="kc-form">' +
        form(field("NIP atau email", "text", "", "username") +
          passwordField("Kata sandi", "password") +
          '<div id="kc-form-buttons">' + submit("Masuk") + '</div>') +
        '</div>';
    }

    function measureLoginLayout() {
      const logo = document.querySelector(".sq-account-brand__logo");
      const root = document.documentElement;
      const card = document.querySelector(".pf-v5-c-login__main").getBoundingClientRect();
      const logoBox = logo.getBoundingClientRect();
      document.body.dataset.logoRect = `${Math.round(logoBox.width)}x${Math.round(logoBox.height)}`;
      const primary = document.querySelector("#kc-login, #registerWebAuthn");
      const formReference = primary.closest("form") || document.querySelector(".pf-v5-c-login__main-body");
      const formBox = formReference.getBoundingClientRect();
      const primaryBox = primary.getBoundingClientRect();

      document.body.dataset.horizontal = String(root.scrollWidth > root.clientWidth + 1);
      document.body.dataset.logoLoaded = String(logo.complete && logo.naturalWidth > 0 && logo.naturalHeight > 0);
      // Full foundation logo: wide enough to read the wordmark, never wider than the card.
      const minimumLogoWidth = innerWidth < 390 ? 200 : 240;
      document.body.dataset.logoSize = String(
        logoBox.width >= minimumLogoWidth && logoBox.width <= 300 &&
        Math.abs(logoBox.width / logoBox.height - 2240 / 721) < 0.05
      );
      document.body.dataset.primaryFull = String(primaryBox.width / formBox.width >= 0.96);
      document.body.dataset.cardCompact = String(card.width <= 456 && card.height < Math.max(700, innerHeight - 8));

      if (mode === "totp") {
        const otpGroup = document.querySelector("#otp").closest(".pf-v5-c-form__group").getBoundingClientRect();
        const trustGroup = document.querySelector("#trustDevice").closest(".pf-v5-c-form__group").getBoundingClientRect();
        const buttonGroup = document.querySelector("#kc-form-buttons").getBoundingClientRect();
        document.body.dataset.totpVertical = String(
          otpGroup.bottom <= trustGroup.top + 1 &&
          trustGroup.bottom <= buttonGroup.top + 1 &&
          primaryBox.width / formBox.width >= 0.96
        );
      }
      if (mode === "passkey") {
        const cancel = document.querySelector("#cancelWebAuthnAIA").getBoundingClientRect();
        document.body.dataset.passkeyActions = String(
          primaryBox.width / formBox.width >= 0.96 &&
          cancel.width / formBox.width >= 0.96 &&
          primaryBox.bottom <= cancel.top + 1
        );
      }
    }

    const scheduleLoginMeasurement = () => {
      requestAnimationFrame(() => requestAnimationFrame(measureLoginLayout));
    };
    if (document.readyState === "complete") {
      scheduleLoginMeasurement();
    } else {
      window.addEventListener("load", scheduleLoginMeasurement, { once: true });
    }
    window.setTimeout(measureLoginLayout, 250);
  </script>
</body>
</html>
